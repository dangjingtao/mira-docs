name: Publish npm package

on:
  release:
    types:
      - published
  push:
    branches:
      - main
    paths:
      - packages/mira-docs/package.json

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify release package
        run: npm run release:check

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          VERSION=$(node -p "require('./packages/mira-docs/package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check whether this version already exists
        id: registry
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if npm view "@uichat-mira/docs@${VERSION}" version \
            --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "@uichat-mira/docs@${VERSION} is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish @uichat-mira/docs with npm Trusted Publishing
        if: steps.registry.outputs.published != 'true'
        working-directory: packages/mira-docs
        run: npm publish --access public

      - name: Record release result
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          if [ "${{ steps.registry.outputs.published }}" = "true" ]; then
            echo "### @uichat-mira/docs@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "The version already existed on npm, so publishing was safely skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### @uichat-mira/docs@${VERSION}" >> "$GITHUB_STEP_SUMMARY"
            echo "Published through npm Trusted Publishing (OIDC)." >> "$GITHUB_STEP_SUMMARY"
          fi
